name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST 긴 퍼즈
  workflow_dispatch:
    inputs:
      mutation:
        description: "표적 변이 테스트(29개)도 실행"
        type: boolean
        default: false

jobs:
  unit:
    name: 테스트 (의존성 없이)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 전체 테스트
        env:
          HARNESS_SCALE: ${{ github.event_name == 'schedule' && 'long' || 'default' }}
        run: ./local-verify/run.sh
      - name: 실패 재현 파일 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-failures
          path: target/local-verify/failures/

  apps:
    name: 응용 (Dijkstra · Prim · 스케줄러)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 기준 알고리즘과 비교 테스트
        working-directory: fibheap-apps
        run: |
          javac -encoding UTF-8 -d out src/*.java
          java -Dfile.encoding=UTF-8 -cp out ApplicationsTest

  maven:
    name: Maven (jqwik + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn test
        run: mvn -B test -Dharness.scale=quick
      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  mutation:
    name: 표적 변이 테스트
    if: github.event_name == 'workflow_dispatch' && inputs.mutation
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 변이 29개 실행
        run: java tools/MutantRunner.java --cmd "HARNESS_SCALE=quick local-verify/run.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: target/mutants/report.md
